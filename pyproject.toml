[project]
name = "caçacarro"
version = "0.1.0"
description = ""
authors = [
    {name = "GabrielBuenoSathler",email = "garouthehumanmonster@protonmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sqlalchemy (>=2.0.52,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pwdlib (>=0.3.1,<0.4.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "psycopg (>=3.3.4,<4.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)"
]

[tool.poetry]
packages = [{include = "caçacarro", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
